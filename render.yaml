databases:
  - name: yaycha-db
    databaseName: yaycha
    user: yaycha
    plan: free
    region: oregon

services:
  - type: web
    name: yaycha-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate --schema prisma/postgres/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema prisma/postgres/schema.prisma && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yaycha-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'